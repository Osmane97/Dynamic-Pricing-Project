name: Run Script Every 6 Hours

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/556213692967/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: amazon-loader@dynamic-pricing-tracker.iam.gserviceaccount.com

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Xvfb and Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          # Remove the preinstalled chromedriver so Selenium downloads the matching version
          sudo rm -f /usr/bin/chromedriver

      - name: Start Xvfb
        run: Xvfb :99 -screen 0 1920x1080x24 &

      - name: Run scraper and load to BigQuery
        env:
          DISPLAY: :99
          GCP_PROJECT_ID: dynamic-pricing-tracker
          AMAZON_LISTING_URL: ${{ vars.AMAZON_LISTING_URL }}
        run: python -m src.main
