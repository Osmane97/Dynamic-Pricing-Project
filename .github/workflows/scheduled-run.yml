name: Run Script Every 6 Hours

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-script:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: amazon
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Check Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Xvfb, Google Chrome, and MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb wget mysql-client
          # Install Google Chrome stable
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          # Remove the preinstalled chromedriver so Selenium downloads the matching version
          sudo rm -f /usr/bin/chromedriver


      - name: Start Xvfb
        run: Xvfb :99 -screen 0 1920x1080x24 &

      - name: Wait for MySQL to be healthy
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 --silent; then
              echo "MySQL is up"
              break
            else
              echo "Waiting for MySQL..."
              sleep 2
            fi
          done
      - name: Run schema.sql to create database tables
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot amazon < schema.sql


      - name: Run Amazon.py with DISPLAY and MySQL env vars
        env:
          DISPLAY: :99
          MYSQL_HOST: '127.0.0.1'
          MYSQL_PORT: 3306
          MYSQL_USER: "root"
          MYSQL_PASSWORD: "root"
          MYSQL_DATABASE: "amazon"
