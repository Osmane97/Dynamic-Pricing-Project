version: 2

sources:
  - name: amazon_raw
    database: dynamic-pricing-tracker
    schema: amazon_raw
    tables:
      - name: gpu_scrapes
        description: One row per product per scrape, appended by the Python scraper. Values are stored exactly as Amazon showed them.
        columns:
          - name: scrape_time
            description: When the product page was scraped (UTC).
          - name: asin
            description: Amazon Standard Identification Number, Amazon's product ID.
          - name: currency
            description: Currency symbol or code Amazon displayed, such as '£' or 'USD'.
          - name: actual_price
            description: Price the product was selling for at scrape time.
          - name: original_price
            description: List price (RRP) shown when the product was discounted, otherwise the selling price.
          - name: discount_percent
            description: Discount shown by Amazon, in percent. 0 when there was no discount.
          - name: last_month_sold
            description: Amazon's "bought in past month" figure, a lower bound such as 50 for "50+ bought".
          - name: product_rating
            description: Average customer rating out of 5.
          - name: number_of_reviews
            description: Number of customer ratings.
          - name: brand
            description: Card manufacturer, such as Gigabyte or ASUS. 'unknown' when Amazon had no value.
          - name: series
            description: Product series from the spec table, such as 'GeForce RTX 5070 Gaming OC'.
          - name: item_model_number
            description: Manufacturer's model number.
          - name: graphics_coprocessor
            description: GPU chip name as the seller wrote it, such as 'NVIDIA GeForce RTX 5080'.
          - name: graphics_chipset_brand
            description: GPU chip maker, such as NVIDIA or AMD.
          - name: graphics_ram_type
            description: Video memory type, such as GDDR7.
          - name: graphics_card_ram_size
            description: Video memory size as text, such as '16 GB' or '16384 MB'.
          - name: memory_clock_speed
            description: Memory clock speed as text.
          - name: product_dimensions
            description: Package or card dimensions as text.
          - name: resolution
            description: Maximum supported resolution as text.
          - name: wattage
            description: Power figure as text. Rarely filled in, so it is not used downstream.
